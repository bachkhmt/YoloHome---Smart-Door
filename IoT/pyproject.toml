[project]
name = "yolohome"
version = "0.1.0"
description = "Smart Door System powered by YOLO, OpenCV, and Micro:bit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "opencv-python>=4.8.0",
    "ultralytics>=8.0.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "paho-mqtt>=1.6",
    "requests>=2.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
